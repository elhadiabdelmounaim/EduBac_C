services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_PRODUCTION=1
      - DATABASE_URL=postgres://edubac:edubac@db:5432/edubac
    depends_on:
      - db
    volumes:
      - media_data:/app/media
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edubac
      POSTGRES_USER: edubac
      POSTGRES_PASSWORD: edubac
    volumes:
      - pg_data:/var/lib/postgresql/data
volumes:
  pg_data:
  media_data:
