{% extends "base.html" %}
{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'education:lesson_detail' lesson.pk %}">{{ lesson.title }}</a></li>
        <li class="breadcrumb-item active">Assistant IA</li>
    </ol>
</nav>
<h1 class="h4 fw-bold mb-3">🤖 Aide sur : {{ lesson.title }}</h1>
<form method="post" class="card card-body shadow-sm mb-3">
    {% csrf_token %}
    <input type="hidden" name="style" id="styleField" value="standard">
    <input type="hidden" name="previous_answer" value="">
    <div class="mb-3">
        <label class="form-label">Niveau</label>
        <select name="level" class="form-select">
            <option value="simple" {% if level == 'simple' %}selected{% endif %}>Simple</option>
            <option value="normal" {% if level != 'simple' and level != 'approfondi' %}selected{% endif %}>Normal</option>
            <option value="approfondi" {% if level == 'approfondi' %}selected{% endif %}>Approfondi</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Question</label>
        <textarea name="question" class="form-control" rows="3" required placeholder="Qu'est-ce que tu n'as pas compris ?"></textarea>
    </div>
    <div class="d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-accent" onclick="document.getElementById('styleField').value='standard'">Expliquer</button>
        <button type="submit" class="btn btn-outline-primary btn-sm" onclick="document.getElementById('styleField').value='etapes'">Par étapes</button>
        <button type="submit" class="btn btn-outline-primary btn-sm" onclick="document.getElementById('styleField').value='exemple'">Exemple</button>
    </div>
</form>
{% if response %}
<div class="ai-response mb-3">{{ response }}</div>
<form method="post">
    {% csrf_token %}
    <input type="hidden" name="level" value="{{ level }}">
    <input type="hidden" name="style" value="autrement">
    <input type="hidden" name="previous_answer" value="{{ response }}">
    <input type="hidden" name="question" value="Explique autrement">
    <button class="btn btn-edubac btn-sm">Explique autrement</button>
</form>
{% endif %}
{% endblock %}
