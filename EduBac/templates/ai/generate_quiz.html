{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-4">Générer un quiz avec l'IA</h1>
<p>Leçon : <strong>{{ lesson.title }}</strong> ({{ lesson.course.name }})</p>
<form method="post" class="card card-body" style="max-width: 500px;">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Nombre de questions</label>
        <input type="number" name="question_count" class="form-control" value="5" min="1" max="20">
    </div>
    <div class="mb-3">
        <label class="form-label">Difficulté</label>
        <select name="difficulty" class="form-select">
            <option value="facile">Facile — application directe</option>
            <option value="moyen" selected>Moyen — 2–3 étapes</option>
            <option value="difficile">Difficile — type examen / pièges</option>
        </select>
        <div class="form-text">La difficulté change réellement le type de questions générées.</div>
    </div>
    <button type="submit" class="btn btn-accent" id="genBtn">
        <i class="bi bi-stars"></i> Générer avec l'IA
    </button>
    <div id="genLoading" class="d-none form-text mt-2" role="status" data-gen-status>Generating quiz...</div>
</form>
<script>
(function(){
  var form = document.querySelector('form');
  var genBtn = document.getElementById('genBtn');
  var genLoading = document.getElementById('genLoading');
  if(!form || !genBtn || !genLoading) return;
  form.addEventListener('submit', function(){
    genLoading.classList.remove('d-none');
    genLoading.textContent = 'Generating quiz...';
    genBtn.disabled = true;
    window.setTimeout(function(){
      try { window.stop(); } catch (err) {}
      genLoading.textContent = 'Generation failed: the server took too long. Please try again.';
      genBtn.disabled = false;
    }, 60000);
  });
})();
</script>
{% endblock %}
