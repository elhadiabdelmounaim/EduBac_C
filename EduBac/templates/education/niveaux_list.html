{% extends "base.html" %}
{% block content %}
<h1 class="h3 fw-bold mb-2 fade-up" style="color:var(--edubac-navy);">Niveau scolaire</h1>
<p class="text-muted mb-4 fade-up">Choisis ton niveau pour accéder aux cours de mathématiques.</p>
<div class="edubac-grid">
{% for lvl in levels %}
    <div class="fade-up fade-up-delay-{{ forloop.counter0|default:0 }}">
        <a href="{% url 'education:niveau_detail' lvl.link_code %}" class="text-decoration-none">
            <div class="level-card card h-100 shadow-sm border-0 {{ lvl.color }}" style="border-radius:18px;transition:transform .15s;">
                <div class="card-body p-4">
                    <div class="d-flex align-items-start gap-3">
                        <div style="font-size:2rem;line-height:1;">{{ lvl.icon }}</div>
                        <div>
                            <h2 class="h6 fw-bold mb-1" style="color:var(--edubac-navy);">{{ lvl.label }}</h2>
                            <p class="small text-muted mb-0">{{ lvl.lesson_count }} leçon{{ lvl.lesson_count|pluralize }}</p>
                        </div>
                    </div>
                    <div class="mt-3 small fw-semibold" style="color:var(--edubac-teal);">
                        Voir les cours <i class="bi bi-arrow-right"></i>
                    </div>
                </div>
            </div>
        </a>
    </div>
{% endfor %}
</div>
<style>
.level-card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,.1)!important; }
</style>
{% endblock %}
