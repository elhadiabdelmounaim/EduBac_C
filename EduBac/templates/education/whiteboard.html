{% extends "base.html" %}
{% block content %}
<div class="fade-up">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
            <h1 class="h3 fw-bold mb-1" style="color:var(--edubac-navy);">Whiteboard</h1>
            <p class="text-muted small mb-0">Tableau blanc pour schémas et calculs</p>
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center">
            <label class="small text-muted mb-0">Couleur</label>
            <input type="color" id="wbColor" value="#1e2a4a" title="Couleur">
            <label class="small text-muted mb-0">Taille</label>
            <input type="range" id="wbSize" min="2" max="24" value="4" style="width:90px;">
            <button type="button" class="btn btn-sm btn-outline-primary" id="wbEraser">Gomme</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="wbClear">Effacer</button>
            <button type="button" class="btn btn-sm btn-edubac" id="wbDownload">Télécharger PNG</button>
        </div>
    </div>
    <div class="card border-0 shadow-sm overflow-hidden" style="border-radius:16px;">
        <canvas id="wbCanvas" width="1200" height="640"
                style="width:100%;height:auto;display:block;background:#fff;cursor:crosshair;touch-action:none;"></canvas>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
(function(){
  var canvas = document.getElementById('wbCanvas');
  if(!canvas) return;
  var ctx = canvas.getContext('2d');
  var drawing = false, lastX = 0, lastY = 0;
  var colorEl = document.getElementById('wbColor');
  var sizeEl = document.getElementById('wbSize');
  var eraseMode = false;

  function pos(e){
    var r = canvas.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - r.left) * (canvas.width / r.width),
      y: (clientY - r.top) * (canvas.height / r.height)
    };
  }
  function start(e){ e.preventDefault(); drawing = true; var p = pos(e); lastX = p.x; lastY = p.y; }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    var p = pos(e);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = parseInt(sizeEl.value, 10) || 4;
    if(eraseMode){
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = colorEl.value;
    }
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
  }
  function end(){ drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  document.getElementById('wbClear').addEventListener('click', function(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
  });
  document.getElementById('wbEraser').addEventListener('click', function(){
    eraseMode = !eraseMode;
    this.classList.toggle('btn-warning', eraseMode);
    this.classList.toggle('btn-outline-primary', !eraseMode);
  });
  document.getElementById('wbDownload').addEventListener('click', function(){
    var a = document.createElement('a');
    a.download = 'edubac-whiteboard.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
})();
</script>
{% endblock %}
