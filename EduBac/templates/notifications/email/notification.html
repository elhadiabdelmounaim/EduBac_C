<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fa;font-family:Segoe UI,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fa;padding:24px 12px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06);">
          <tr>
            <td style="background:linear-gradient(90deg,#156060,#1a6b6b);padding:20px 28px;color:#fff;">
              <div style="font-size:20px;font-weight:700;">EduBac</div>
              <div style="font-size:12px;opacity:.85;">Mathématiques</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <p style="margin:0 0 8px;color:#556;">Bonjour {{ recipient_name }},</p>
              <h1 style="margin:0 0 12px;font-size:18px;color:#1a1f36;">{{ title }}</h1>
              <p style="margin:0 0 20px;color:#333;line-height:1.55;">{{ message }}</p>
              {% if link %}
              <p style="margin:0 0 24px;">
                <a href="{{ link }}"
                   style="display:inline-block;background:#1a6b6b;color:#fff;text-decoration:none;
                          padding:12px 22px;border-radius:999px;font-weight:600;font-size:14px;">
                  Ouvrir sur EduBac
                </a>
              </p>
              {% endif %}
              <p style="margin:0;font-size:12px;color:#99a;">
                Cet e-mail a été envoyé automatiquement par EduBac.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
