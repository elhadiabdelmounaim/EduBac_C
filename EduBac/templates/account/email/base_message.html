<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block subject %}EduBac{% endblock %}</title>
<style>
  body { margin:0; padding:0; background:#f7fafc; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; color:#1a202c; }
  .wrapper { max-width:560px; margin:40px auto; background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,.08); }
  .header { background:#2A0C3D; color:#fff; padding:28px 32px; text-align:center; }
  .header h1 { margin:0; font-size:1.5rem; letter-spacing:.5px; }
  .header p { margin:6px 0 0; opacity:.85; font-size:.9rem; }
  .body { padding:32px; line-height:1.65; font-size:1rem; }
  .body p { margin:0 0 1em; }
  .btn { display:inline-block; background:#DD8826; color:#fff !important; text-decoration:none; padding:14px 28px; border-radius:999px; font-weight:600; margin:12px 0; }
  .btn:hover { background:#dd6b20; }
  .link { word-break:break-all; color:#386769; font-size:.9rem; }
  .muted { color:#718096; font-size:.9rem; }
  .footer { padding:20px 32px; background:#F3E6A7; font-size:.85rem; color:#718096; text-align:center; }
  .footer a { color:#386769; }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>EduBac</h1>
      <p>Plateforme d'apprentissage des mathématiques</p>
    </div>
    <div class="body">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      EduBac — La mathématique, plus proche de toi !<br>
      Apprendre aujourd'hui, réussir demain
    </div>
  </div>
</body>
</html>
