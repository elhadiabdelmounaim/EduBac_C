{% extends "base.html" %}
{% block title %}E-mail envoyé{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <i class="bi bi-envelope-check display-4 text-primary mb-3"></i>
                <h1 class="h4 mb-3">E-mail envoyé</h1>
                <p class="text-muted">
                    Si un compte est associé à cette adresse, vous recevrez un e-mail contenant un lien de réinitialisation.
                </p>
                <p class="small text-muted">Pensez à vérifier vos spams.</p>
                <a href="{% url 'account_login' %}" class="btn btn-edubac mt-2">Retour à la connexion</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
