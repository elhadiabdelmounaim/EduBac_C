{% extends "base.html" %}
{% block content %}
<div class="auth-page">
    <div class="auth-card position-relative" style="max-width:480px;">
        <div class="auth-brand">
            <div class="logo-circle float-soft"><i class="bi bi-mortarboard-fill"></i></div>
            <h1 class="h4 fw-bold mb-1" style="color:var(--edubac-navy);">Créer un compte</h1>
            <p class="text-muted small mb-0">Choisissez votre type de compte</p>
        </div>
        <div class="d-grid gap-3 mt-2">
            <a href="{% url 'accounts:register_student' %}" class="btn btn-edubac btn-lg py-3">
                <span style="font-size:1.5rem;">👨‍🎓</span><br>
                <strong>Inscription élève</strong>
                <div class="small fw-normal opacity-75">Suivre les cours et les quiz</div>
            </a>
            <a href="{% url 'accounts:register_teacher' %}" class="btn btn-outline-primary btn-lg py-3">
                <span style="font-size:1.5rem;">👩‍🏫</span><br>
                <strong>Inscription enseignant</strong>
                <div class="small fw-normal">Gérer classes et quiz</div>
            </a>
        </div>
        <p class="text-center small text-muted mt-4 mb-0">
            Déjà un compte ?
            <a href="{% url 'accounts:login' %}" class="fw-semibold">Se connecter</a>
        </p>
    </div>
</div>
{% endblock %}
