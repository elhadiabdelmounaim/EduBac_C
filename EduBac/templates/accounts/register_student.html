{% extends "base.html" %}
{% block content %}
<div class="auth-page">
    <div class="auth-card position-relative" style="max-width:480px;">
        <div class="auth-brand">
            <img src="/static/img/edubac-logo.png" alt="EduBac" class="auth-logo float-soft">
            <h1 class="h4 fw-bold mb-1" style="color:var(--edubac-navy);">Inscription élève</h1>
            <p class="text-muted small mb-0">Crée ton compte avec le code de ta classe. Il sera activé après validation de l’administrateur.</p>
        </div>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-2">
                <label class="form-label small fw-semibold">Nom *</label>
                <input type="text" name="name" class="form-control" required
                       placeholder="Prénom et nom" autocomplete="name">
            </div>
            <div class="mb-2">
                <label class="form-label small fw-semibold">Nom d’utilisateur *</label>
                <input type="text" name="username" class="form-control" required maxlength="150"
                       autocomplete="username">
            </div>
            <div class="mb-2">
                <label class="form-label small fw-semibold">Code de classe *</label>
                <input type="text" name="class_code" class="form-control" required maxlength="12"
                       autocomplete="off" autocapitalize="characters">
            </div>
            <div class="mb-2">
                <label class="form-label small fw-semibold">Mot de passe *</label>
                <div class="password-field">
                    <input type="password" name="password" id="p1" class="form-control" required minlength="6" autocomplete="new-password">
                    <button type="button" class="password-toggle" data-target="p1"><i class="bi bi-eye"></i></button>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Confirmer le mot de passe *</label>
                <div class="password-field">
                    <input type="password" name="password2" id="p2" class="form-control" required minlength="6" autocomplete="new-password">
                    <button type="button" class="password-toggle" data-target="p2"><i class="bi bi-eye"></i></button>
                </div>
            </div>
            <button type="submit" class="btn btn-accent w-100 py-2 mb-3">Envoyer ma demande</button>
        </form>
        <p class="text-center small mb-0 text-muted">
            Déjà un compte ? <a href="{% url 'accounts:login' %}" class="fw-semibold">Connexion</a>
        </p>
    </div>
</div>
{% endblock %}
