{% extends "base.html" %}
{% block extra_css %}<link rel="stylesheet" href="{% asset 'css/auth-glass.css' %}">{% endblock %}
{% block content %}
<div class="auth-page auth-glass">
    <span class="auth-float f1" aria-hidden="true">∑</span>
    <span class="auth-float f2" aria-hidden="true">π</span>
    <div class="auth-card">
        <div class="auth-brand">
            <img src="/static/img/edubac-logo.png" alt="EduBac" class="auth-logo">
            <h1 class="auth-title">Connexion</h1>
            <p class="auth-subtitle">Nom d’utilisateur ou e-mail et mot de passe</p>
        </div>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            <div class="ag-field">
                <label class="visually-hidden" for="loginUsername">Nom d’utilisateur ou e-mail</label>
                <i class="bi bi-person ag-icon" aria-hidden="true"></i>
                <input type="text" name="username" id="loginUsername" class="form-control" required autofocus
                       placeholder="Nom d’utilisateur ou e-mail" autocomplete="username">
            </div>
            <div class="ag-field password-field">
                <label class="visually-hidden" for="loginPassword">Mot de passe</label>
                <i class="bi bi-lock ag-icon" aria-hidden="true"></i>
                <input type="password" name="password" id="loginPassword" class="form-control" required
                       placeholder="Mot de passe" autocomplete="current-password">
                <button type="button" class="password-toggle" data-target="loginPassword"
                        aria-label="Afficher le mot de passe" aria-pressed="false">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
            <div class="ag-row">
                <label class="ag-check">
                    <input type="checkbox" name="remember" value="1"> Se souvenir de moi
                </label>
                <a href="{% url 'accounts:forgot_password' %}" class="ag-link">Mot de passe oublié ?</a>
            </div>
            <button type="submit" class="ag-submit">
                <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>Se connecter
            </button>
        </form>
        <p class="ag-footer">
            Pas encore de compte ?
            <a href="{% url 'accounts:register_student' %}">Inscription élève</a>
        </p>
    </div>
</div>
{% endblock %}
