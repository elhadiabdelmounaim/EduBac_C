{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-4">Mes leçons</h1>
<div class="list-group shadow-sm">
{% for l in lessons %}
    <a href="{% url 'education:lesson_detail' l.pk %}" class="list-group-item list-group-item-action d-flex justify-content-between">
        <span><strong>{{ l.course.name }}</strong> — {{ l.title }}</span>
        <i class="bi bi-chevron-right"></i>
    </a>
{% empty %}
    <div class="alert alert-info">Aucune leçon disponible.</div>
{% endfor %}
</div>
{% endblock %}
