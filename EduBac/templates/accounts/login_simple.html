{% extends "base.html" %}
{% block content %}
<div class="auth-page">
    <span class="auth-float f1">∑</span>
    <span class="auth-float f2">π</span>
    <span class="auth-float f3">√x</span>
    <span class="auth-float f4">∞</span>
    <div class="auth-card position-relative">
        <div class="auth-brand">
            <div class="logo-circle float-soft"><i class="bi bi-mortarboard-fill"></i></div>
            <h1 class="h4 fw-bold mb-1" style="color:var(--edubac-navy);">Connexion</h1>
            <p class="text-muted small mb-0">Accédez à votre espace mathématiques</p>
        </div>
        <div class="text-center mb-3" style="font-size:2rem;">👨‍🎓 📚 ✏️</div>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold">E-mail</label>
                <input type="text" name="username" class="form-control" required autofocus
                       placeholder="votre@email.com" autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Mot de passe</label>
                <div class="password-field">
                    <input type="password" name="password" id="loginPassword" class="form-control" required
                           placeholder="Votre mot de passe" autocomplete="current-password">
                    <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Afficher le mot de passe">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-edubac w-100 py-2 mb-3">Se connecter</button>
        </form>
        <p class="text-center small mb-0 text-muted">
            Pas encore de compte ?
            <a href="{% url 'accounts:register' %}" class="fw-semibold">S'inscrire</a>
        </p>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.querySelectorAll('.password-toggle').forEach(function(btn) {
    btn.addEventListener('click', function() {
        var input = document.getElementById(btn.getAttribute('data-target'));
        if (!input) return;
        var icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            if (icon) icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            if (icon) icon.className = 'bi bi-eye';
        }
    });
});
</script>
{% endblock %}
