{% extends "base.html" %}
{% block content %}
<div class="auth-page">
    <div class="auth-card position-relative" style="max-width:520px;">
        <div class="auth-brand">
            <div class="logo-circle float-soft"><i class="bi bi-mortarboard-fill"></i></div>
            <h1 class="h4 fw-bold mb-1" style="color:var(--edubac-navy);">EduBac</h1>
            <p class="text-muted small mb-0">Connexion ou inscription</p>
        </div>
        <div class="row g-3">
            <div class="col-md-6">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body text-center">
                        <div style="font-size:2rem;">👨‍🎓</div>
                        <h2 class="h6 fw-bold">Élève</h2>
                        <a href="{% url 'accounts:login_student' %}" class="btn btn-edubac btn-sm w-100 mb-2">Connexion</a>
                        <a href="{% url 'accounts:register_student' %}" class="btn btn-outline-primary btn-sm w-100">Inscription</a>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body text-center">
                        <div style="font-size:2rem;">👩‍🏫</div>
                        <h2 class="h6 fw-bold">Enseignant</h2>
                        <a href="{% url 'accounts:login_teacher' %}" class="btn btn-accent btn-sm w-100 mb-2">Connexion</a>
                        <a href="{% url 'accounts:register_teacher' %}" class="btn btn-outline-primary btn-sm w-100">Inscription</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
