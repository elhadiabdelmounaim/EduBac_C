<link rel="stylesheet" href="/static/css/whiteboard-share.css">
<section class="wb-share mb-3" id="wbShareView"
         data-bound="0"
         data-image="{% url 'whiteboard:share_image' share.pk %}"
         data-share-id="{{ share.pk }}"
         data-classroom-id="{{ share.classroom_id }}"
         data-api="{% url 'whiteboard:share_api' %}"
         data-follow="{% if follow %}1{% else %}0{% endif %}">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
        <div>
            {% if not is_teacher %}
            <h2 class="h5 fw-bold mb-1 wb-share-head">🔒 Whiteboard partagé — Lecture seule</h2>
            {% else %}
            <h2 class="h5 fw-bold mb-1 wb-share-head">Aperçu du partage</h2>
            {% endif %}
            <p class="small text-muted mb-0" data-share-meta>{{ share.when_label }} · {{ share.classroom.name }} — <span data-share-title>{{ share.title }}</span></p>
        </div>
        <div class="wb-share-tools" role="toolbar" aria-label="Zoom du whiteboard">
            <button type="button" class="btn btn-sm btn-outline-secondary" data-zoom="out" aria-label="Dézoomer">−</button>
            <span class="small" data-zoom-label>100%</span>
            <button type="button" class="btn btn-sm btn-outline-secondary" data-zoom="in" aria-label="Zoomer">+</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" data-zoom="reset">Réinitialiser</button>
            <button type="button" class="btn btn-sm btn-edubac" data-fullscreen>Plein écran</button>
        </div>
    </div>
    <div class="alert alert-info py-2 small" data-share-banner hidden></div>
    <div class="wb-share-viewport" tabindex="0" role="img" aria-label="Whiteboard en lecture seule. Faites glisser pour déplacer la vue.">
        <div class="wb-share-stage">
            <canvas class="wb-share-canvas" width="1600" height="1000" aria-hidden="true"></canvas>
        </div>
    </div>
    <p class="small text-muted mt-2 mb-0">Lecture seule : le dessin, l’effacement et le partage sont désactivés.</p>
</section>
<script src="/static/js/whiteboard-share-view.js"></script>
